name: Java CI with Gradle

on:
  push:
    branches:
      - "main"
      - "phase/1.5-single-module-hexagonal-architecture"
  pull_request:
    branches:
      - "main"
      - "phase/1.5-single-module-hexagonal-architecture"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build
