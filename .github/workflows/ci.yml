name: Java CI with Gradle

on:
  push:
    branches:
      - "main"
      - "phase/2.0-multi-module-architecture"
  pull_request:
    branches:
      - "main"
      - "phase/2.0-multi-module-architecture"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle 캐시 설정 단계 추가
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          # 캐시할 파일 경로: Gradle이 사용하는 캐시 디렉토리들
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # 캐시 키: build.gradle.kts 파일 내용이 바뀌면 새로운 캐시를 생성
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          # 복원 키: 정확한 캐시 키가 없을 경우, 이전 버전의 캐시라도 사용
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_HOURS: ${{ secrets.JWT_EXPIRATION_HOURS }}
        run: ./gradlew build

      # Codecov 업로드 단계 추가
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # JaCoCo XML 리포트 경로
          files: ./build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          verbose: true
