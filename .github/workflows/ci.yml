name: Java CI with Gradle

on:
  push:
    branches:
      - "main"
      - "phase/2.5-high-performed-monolith"
  pull_request:
    branches:
      - "main"
      - "phase/2.5-high-performed-monolith"

jobs:
  test:
    name: Test + Jacoco (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - module-app
          - module-auth
          - module-delivery
          - module-order
          - module-payment
          - module-product
          - module-user

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test + Jacoco Report
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_HOURS: ${{ secrets.JWT_EXPIRATION_HOURS }}
        run: ./gradlew :${{ matrix.module }}:test :${{ matrix.module }}:jacocoTestReport --stacktrace

      - name: Upload Jacoco XML (${{ matrix.module }})
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.module }}
          if-no-files-found: error
          path: |
            ${{ matrix.module }}/build/reports/jacoco/**/jacocoTestReport.xml
            ${{ matrix.module }}/build/reports/jacoco/**/jacocoTestReport.xml*

  coverage:
    name: Coverage (Codecov)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Download Jacoco reports
        uses: actions/download-artifact@v4
        with:
          pattern: jacoco-*
          merge-multiple: true
          path: jacoco-reports

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: jacoco-reports/**/*.xml
          verbose: true
