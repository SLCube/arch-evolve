name: Monolith CI

on:
  push:
    branches:
      - "main"
      - "phase/3.0-micro-services-architecture"
    paths:
      - 'monolith/**'
      - '.github/workflows/monolith-ci.yml'
  pull_request:
    branches:
      - "main"
      - "phase/3.0-micro-services-architecture"
    paths:
      - 'monolith/**'
      - '.github/workflows/monolith-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-monolith-${{ hashFiles('monolith/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-monolith-

      - name: Grant execute permission for gradlew
        working-directory: monolith
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: monolith
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_HOURS: ${{ secrets.JWT_EXPIRATION_HOURS }}
          JWT_REFRESH_EXPIRATION_HOURS: ${{ secrets.JWT_REFRESH_EXPIRATION_HOURS }}
        run: ./gradlew build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: monolith/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: monolith
          verbose: true
