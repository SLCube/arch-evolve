server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: gateway

jwt:
  secret: ${jwt.secret}

spring:
  profiles:
    include:
      - secret
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: payment-service
              uri: http://localhost:8082
              predicates:
                - Path=/payment/**
              filters:
                - JwtAuthentication
                - StripPrefix=1

            - id: monolith
              uri: http://localhost:8081
              predicates:
                - Path=/**
