server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: gateway
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces  # 로컬 JVM 기동 기준. 컨테이너화 시 tempo:4318로 변경 필요

jwt:
  secret: ${jwt.secret}

spring:
  profiles:
    include:
      - secret
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: payment-service
              uri: http://localhost:8082
              predicates:
                - Path=/payment/**
              filters:
                - JwtAuthentication
                - StripPrefix=1

            - id: delivery-service
              uri: http://localhost:8083
              predicates:
                - Path=/delivery/**
              filters:
                - JwtAuthentication
                - StripPrefix=1

            - id: monolith
              uri: http://localhost:8081
              predicates:
                - Path=/**
