name: arch-evolve-demo

x-app: &app
  restart: unless-stopped
  environment:
    SPRING_PROFILES_ACTIVE: docker
  mem_limit: 768m
  healthcheck:
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 60s

x-db: &db
  image: postgres:15.10-alpine
  restart: unless-stopped
  healthcheck:
    test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
    interval: 5s
    timeout: 3s
    retries: 12

services:
  monolith-db:
    <<: *db
    environment:
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
      POSTGRES_DB: playground
    volumes:
      - monolith-data:/var/lib/postgresql/data
  payment-db:
    <<: *db
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment
    volumes:
      - payment-data:/var/lib/postgresql/data
  delivery-db:
    <<: *db
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
      POSTGRES_DB: delivery
    volumes:
      - delivery-data:/var/lib/postgresql/data
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, 'yes']
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
  kafka-init:
    image: apache/kafka:3.7.0
    entrypoint: [/bin/bash, /demo/init-topics.sh]
    volumes:
      - ./infra/demo/init-topics.sh:/demo/init-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'
  wiremock:
    image: wiremock/wiremock:3.13.0
    restart: unless-stopped
    volumes:
      - ./infra/src/main/resources/wiremock:/home/wiremock:ro
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8080/__admin/mappings >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
  monolith:
    <<: *app
    build:
      context: .
      target: monolith
    depends_on:
      monolith-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      delivery-service:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:8081/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
  payment-service:
    <<: *app
    build:
      context: .
      target: payment-service
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      wiremock:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:8082/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
  delivery-service:
    <<: *app
    build:
      context: .
      target: delivery-service
    depends_on:
      delivery-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:8083/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
  api-gateway:
    <<: *app
    build:
      context: .
      target: api-gateway
    ports:
      - '127.0.0.1:18080:8080'
    depends_on:
      monolith:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:8080/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  demo-init:
    image: arch-evolve-demo-tools:local
    build:
      context: ./infra/demo
    command: [seed]
    depends_on:
      api-gateway:
        condition: service_healthy
    volumes:
      - demo-state:/state
    restart: 'no'
  # Makes `up --wait` include successful one-shot initialization in readiness.
  demo-ready:
    image: arch-evolve-demo-tools:local
    build:
      context: ./infra/demo
    entrypoint: [python, -m, http.server, '8080', --directory, /state]
    depends_on:
      demo-init:
        condition: service_completed_successfully
    volumes:
      - demo-state:/state:ro
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; json.load(urllib.request.urlopen('http://localhost:8080/demo.json'))"]
      interval: 5s
      timeout: 3s
      retries: 12
  smoke-test:
    profiles: [tools]
    image: arch-evolve-demo-tools:local
    build:
      context: ./infra/demo
    command: [smoke]
    depends_on:
      demo-init:
        condition: service_completed_successfully
    volumes:
      - demo-state:/state:ro

volumes:
  monolith-data:
  payment-data:
  delivery-data:
  redis-data:
  kafka-data:
  demo-state:
