version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: playground-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=playground
      - POSTGRES_PASSWORD=playground
      - POSTGRES_DB=playground
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres-data:
