[versions]
kotlin = "1.9.22"
java = "21"
springBoot = "3.3.1"
springDependencyManagement = "1.1.5"

kotlinJdsl = "3.5.5"
jjwt = "0.12.5"
kotest = "5.8.0"
kotestSpringExtension = "1.1.3"
archunit = "1.2.1"
asciidoctor = "3.3.2"
ktlint = "12.1.0"

[libraries]
# --- kotlin plugin ---
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
kotlin-noarg = { module = "org.jetbrains.kotlin:kotlin-noarg", version.ref = "kotlin" }

# --- Spring Boot plugins ---
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }
spring-dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "springDependencyManagement" }

# --- Spring/Core ---
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-aop = { module = "org.springframework.boot:spring-boot-starter-aop" }
spring-boot-docker-compose = { module = "org.springframework.boot:spring-boot-docker-compose" }

# --- Kotlin ---
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

# --- Database ---
postgres = { module = "org.postgresql:postgresql", version = "42.7.3" }

# --- JDSL ---
kotlin-jdsl-core = { module = "com.linecorp.kotlin-jdsl:jpql-dsl", version.ref = "kotlinJdsl" }
kotlin-jdsl-render = { module = "com.linecorp.kotlin-jdsl:jpql-render", version.ref = "kotlinJdsl" }
kotlin-jdsl-jpa = { module = "com.linecorp.kotlin-jdsl:spring-data-jpa-support", version.ref = "kotlinJdsl" }

# --- Security ---
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# --- Testing ---
kotest-runner = { module = "io.kotest:kotest-runner-junit5-jvm", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core-jvm", version.ref = "kotest" }
kotest-spring = { module = "io.kotest.extensions:kotest-extensions-spring", version.ref = "kotestSpringExtension" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
restdocs-mockmvc = { module = "org.springframework.restdocs:spring-restdocs-mockmvc", version = "3.0.1" }
restdocs-asciidoctor = { module = "org.springframework.restdocs:spring-restdocs-asciidoctor", version = "3.0.1" }

[bundles]
jjwt = ["jjwt-api", "jjwt-impl", "jjwt-jackson"]
kotest = ["kotest-runner", "kotest-assertions", "kotest-spring"]
kotlin-jdsl = ["kotlin-jdsl-core", "kotlin-jdsl-render", "kotlin-jdsl-jpa"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
asciidoctor-convert = { id = "org.asciidoctor.jvm.convert", version.ref = "asciidoctor" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }