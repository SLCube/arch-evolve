services:
  k6:
    image: grafana/k6:latest
    container_name: k6
    volumes:
      - ./k6:/scripts
    working_dir: /scripts
    entrypoint: ["k6"]
    environment:
      - BASE_URL=http://host.docker.internal:8080
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
    command: [
      "run",
      "--tag",
      "test_id=order-test-vu1-1rps-local",
      "--out",
      "experimental-prometheus-rw",
      "order-test.js"
    ]
    networks:
      - monitoring

networks:
  monitoring:
    external: true
    name: monitoring
