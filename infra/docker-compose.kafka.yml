services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: playground-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=playground-kafka-cluster-id-1
    volumes:
      - kafka-data:/var/kafka-logs
    restart: always

  wiremock:
    image: wiremock/wiremock:3.13.0
    container_name: wiremock
    command: [ "--port", "8080", "--container-threads", "500" ]
    volumes:
      - ./src/main/resources/wiremock:/home/wiremock
    ports:
      - "9091:8080"

volumes:
  kafka-data:
