global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: "monolith"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - host.docker.internal:8081

  - job_name: "payment-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - host.docker.internal:8082

  - job_name: "delivery-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - host.docker.internal:8083
