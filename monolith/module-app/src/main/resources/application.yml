jwt:
  secret: ${jwt.secret}
  expiration-hours: ${jwt.expiration-hours}
  refresh-expiration-hours: ${jwt.refresh-expiration-hours}

payment-service:
  url: http://localhost:8082

spring:
  profiles:
    include:
      - secret
      - kafka
      - monitoring
  docker:
    compose:
      file: monolith/docker-compose.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/playground
    username: playground
    password: playground
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 30
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

logging:
  level:
    root: info
    com.playground: info
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] [%-7.7thread] [%-40.40logger{39}] - %msg method=%X{method}, path=%X{path}, requestId=%X{requestId}%n'

server:
  port: 8081
  tomcat:
    threads:
      max: 200
      min-spare: 50
    accept-count: 100
    max-connections: 10000
    mbeanregistry:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    url: /docs/openapi3.yaml
    disable-swagger-default-url: true
  show-actuator: false
  packages-to-scan: "com.playground.nonexistent"  # 존재하지 않는 패키지로 Controller 스캔 방지

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    com.playground: info

---
spring:
  config:
    activate:
      on-profile: test
logging:
  level:
    com.playground: debug
