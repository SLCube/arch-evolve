openapi: 3.0.1
info:
  title: PlayGround API Documentation
  description: PlayGround 프로젝트의 REST API 문서
  version: v2.5
servers:
- url: http://localhost:8080
tags: []
security:
- bearerAuth: []
paths:
  /auth/logout:
    delete:
      tags:
      - 인증 API
      summary: 로그아웃
      description: 사용자 로그아웃 및 Refresh Token 무효화
      operationId: 로그아웃 - 성공
      responses:
        "204":
          description: "204"
  /auth/refresh:
    post:
      security: []
      tags:
      - 인증 API
      summary: 토큰 갱신
      description: Refresh Token을 사용하여 새로운 Access Token과 Refresh Token 발급
      operationId: '토큰 갱신 '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/users-addresses486549215'
            examples:
              토큰 갱신 실패 - 만료된 토큰:
                value: "{\n  \"refreshToken\" : \"expired-refresh-token\"\n}"
              토큰 갱신 성공:
                value: "{\n  \"refreshToken\" : \"valid-refresh-token\"\n}"
      responses:
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                토큰 갱신 실패 - 만료된 토큰:
                  value: "{\n  \"code\" : \"INVALID_REFRESH_TOKEN\",\n  \"message\"\
                    \ : \"유효하지 않거나 만료된 Refresh Token입니다.\",\n  \"errors\" : { }\n}"
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                토큰 갱신 성공:
                  value: "{\n  \"accessToken\" : \"new-access-token\",\n  \"refreshToken\"\
                    \ : \"new-refresh-token\"\n}"
  /orders:
    get:
      tags:
      - 주문 API
      summary: 주문 목록 조회
      description: "인증된 사용자의 주문 목록을 페이징하여 조회합니다. 각 주문의 요약 정보(대표 상품명, 총 가격, 상태, 생성일\
        )를 포함합니다. 페이지 번호, 크기, 정렬 기준을 쿼리 파라미터로 지정할 수 있습니다."
      operationId: '주문 목록 조회 '
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                주문 목록 조회 실패 - 다른 사용자의 주문은 조회되지 않음:
                  value: "{\n  \"content\" : [ ],\n  \"pageNumber\" : 0,\n  \"pageSize\"\
                    \ : 10,\n  \"totalElements\" : 0,\n  \"totalPages\" : 0\n}"
                주문 목록 조회 성공:
                  value: "{\n  \"content\" : [ {\n    \"id\" : 1,\n    \"representativeProductName\"\
                    \ : \"상품1 외 1건\",\n    \"totalPrice\" : 19000,\n    \"status\"\
                    \ : \"PENDING\",\n    \"createdAt\" : \"2025-12-01 10:00:00\"\n\
                    \  }, {\n    \"id\" : 2,\n    \"representativeProductName\" :\
                    \ \"상품1 외 1건\",\n    \"totalPrice\" : 19000,\n    \"status\" :\
                    \ \"PENDING\",\n    \"createdAt\" : \"2025-12-01 10:00:00\"\n\
                    \  }, {\n    \"id\" : 3,\n    \"representativeProductName\" :\
                    \ \"상품1 외 1건\",\n    \"totalPrice\" : 19000,\n    \"status\" :\
                    \ \"PENDING\",\n    \"createdAt\" : \"2025-12-01 10:00:00\"\n\
                    \  } ],\n  \"pageNumber\" : 0,\n  \"pageSize\" : 10,\n  \"totalElements\"\
                    \ : 3,\n  \"totalPages\" : 1\n}"
    post:
      tags:
      - 주문 API
      summary: 주문 생성
      description: "사용자가 여러 상품을 선택하여 주문을 생성합니다. 주문 생성 시 상품 ID와 수량, 배송지 ID를 전달하면 주문\
        \ 정보가 생성됩니다."
      operationId: '주문 생성 '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/users-addresses486549215'
            examples:
              주문 생성 실패 - 주문 상품이 비어있음:
                value: "{\n  \"addressId\" : 1,\n  \"orderProducts\" : [ ]\n}"
              주문 생성 성공:
                value: "{\n  \"addressId\" : 1,\n  \"orderProducts\" : [ {\n    \"\
                  productId\" : 1,\n    \"quantity\" : 2\n  }, {\n    \"productId\"\
                  \ : 2,\n    \"quantity\" : 3\n  } ]\n}"
              주문 생성 실패 - 상품이 존재하지 않음:
                value: "{\n  \"addressId\" : 1,\n  \"orderProducts\" : [ {\n    \"\
                  productId\" : 999,\n    \"quantity\" : 1\n  } ]\n}"
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                주문 생성 실패 - 주문 상품이 비어있음:
                  value: "{\n  \"code\" : \"INVALID_INPUT\",\n  \"message\" : \"입력\
                    값이 유효하지 않습니다.\",\n  \"errors\" : {\n    \"orderProducts\" : \"\
                    주문 상품은 최소 1개 이상이어야 합니다.\"\n  }\n}"
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                주문 생성 성공:
                  value: "{\n  \"id\" : 1,\n  \"userId\" : 2,\n  \"totalPrice\" :\
                    \ 19000,\n  \"status\" : \"PENDING\",\n  \"orderProducts\" : [\
                    \ {\n    \"id\" : 1,\n    \"productId\" : 1,\n    \"quantity\"\
                    \ : 2,\n    \"price\" : 5000\n  }, {\n    \"id\" : 2,\n    \"\
                    productId\" : 2,\n    \"quantity\" : 3,\n    \"price\" : 3000\n\
                    \  } ]\n}"
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                주문 생성 실패 - 상품이 존재하지 않음:
                  value: "{\n  \"code\" : \"ORDERABLE_PRODUCT_NOT_FOUND\",\n  \"message\"\
                    \ : \"주문하려는 상품을 찾을 수 없습니다. (상품 ID: 999)\",\n  \"errors\" : { }\n\
                    }"
  /orders/{orderId}:
    get:
      tags:
      - 주문 API
      summary: 주문 상세 조회
      description: "주문 ID로 특정 주문의 상세 정보를 조회합니다. 주문 정보, 주문 상품 목록, 배송 정보를 포함하여 반환합니다\
        . 인증된 사용자는 본인의 주문만 조회할 수 있습니다."
      operationId: '주문 상세 조회 '
      parameters:
      - name: orderId
        in: path
        description: ""
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                주문 상세 조회 성공:
                  value: "{\n  \"id\" : 1,\n  \"userId\" : 2,\n  \"totalPrice\" :\
                    \ 19000,\n  \"status\" : \"PENDING\",\n  \"orderProducts\" : [\
                    \ {\n    \"id\" : 1,\n    \"productId\" : 1,\n    \"productName\"\
                    \ : \"상품1\",\n    \"quantity\" : 2,\n    \"price\" : 5000\n  },\
                    \ {\n    \"id\" : 2,\n    \"productId\" : 2,\n    \"productName\"\
                    \ : \"상품2\",\n    \"quantity\" : 3,\n    \"price\" : 3000\n  }\
                    \ ],\n  \"delivery\" : {\n    \"deliveryId\" : 100,\n    \"receiverName\"\
                    \ : \"홍길동\",\n    \"receiverPhoneNumber\" : \"010-1111-2222\"\
                    ,\n    \"zipCode\" : \"12345\",\n    \"baseAddress\" : \"서울시 테\
                    스트구\",\n    \"detailAddress\" : \"101동 202호\",\n    \"deliveryStatus\"\
                    \ : \"PENDING\"\n  },\n  \"createdAt\" : \"2025-12-01 10:00:00\"\
                    \n}"
        "403":
          description: "403"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                주문 상세 조회 실패 - 다른 사용자의 주문:
                  value: "{\n  \"code\" : \"ORDER_ACCESS_DENIED\",\n  \"message\"\
                    \ : \"해당 주문에 대한 접근 권한이 없습니다. (주문 ID: 10, 사용자 ID: 3)\",\n  \"errors\"\
                    \ : { }\n}"
  /orders/{orderId}/cancel:
    patch:
      tags:
      - 주문 API
      summary: 주문 취소
      description: "생성된 주문을 취소합니다. 주문 ID를 경로 변수로 전달하며, 인증된 사용자의 주문만 취소할 수 있습니다. 취소\
        \ 성공 시 주문 상태가 CANCELLED로 변경됩니다."
      operationId: '주문 취소 '
      parameters:
      - name: orderId
        in: path
        description: ""
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                주문 취소 성공:
                  value: "{\n  \"id\" : 1,\n  \"userId\" : 2,\n  \"totalPrice\" :\
                    \ 19000,\n  \"status\" : \"CANCELLED\",\n  \"orderProducts\" :\
                    \ [ {\n    \"id\" : 1,\n    \"productId\" : 1,\n    \"quantity\"\
                    \ : 2,\n    \"price\" : 5000\n  }, {\n    \"id\" : 2,\n    \"\
                    productId\" : 2,\n    \"quantity\" : 3,\n    \"price\" : 3000\n\
                    \  } ]\n}"
        "403":
          description: "403"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                주문 취소 실패 - 다른 사용자의 주문:
                  value: "{\n  \"code\" : \"ORDER_ACCESS_DENIED\",\n  \"message\"\
                    \ : \"해당 주문에 대한 접근 권한이 없습니다. (주문 ID: 10, 사용자 ID: 3)\",\n  \"errors\"\
                    \ : { }\n}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                주문 취소 실패 - 이미 취소된 주문:
                  value: "{\n  \"code\" : \"ORDER_STATUS_INVALID_FOR_CANCEL\",\n \
                    \ \"message\" : \"주문 상태가 PENDING 또는 COMPLETED일 때만 취소할 수 있습니다.\
                    \ (현재 상태: CANCELLED)\",\n  \"errors\" : { }\n}"
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                주문 취소 실패 - 존재하지 않는 주문:
                  value: "{\n  \"code\" : \"ORDER_NOT_FOUND\",\n  \"message\" : \"\
                    주문을 찾을 수 없습니다. (ID: 999)\",\n  \"errors\" : { }\n}"
  /products:
    get:
      tags:
      - 상품 API
      summary: 상품 목록 조회
      description: 등록된 모든 상품의 목록을 조회합니다.
      operationId: 상품 목록 조회 - 성공
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                상품 목록 조회 - 성공:
                  value: "[ {\n  \"id\" : 1,\n  \"name\" : \"상품0\",\n  \"stock\" :\
                    \ 0,\n  \"price\" : 0\n}, {\n  \"id\" : 2,\n  \"name\" : \"상품\
                    1\",\n  \"stock\" : 10,\n  \"price\" : 10000\n} ]"
    post:
      tags:
      - 상품 API
      summary: 상품 등록
      description: 새로운 상품을 등록합니다. ADMIN 권한이 필요합니다.
      operationId: '상품 등록 '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/users-addresses486549215'
            examples:
              상품 등록 실패 - USER 권한으로 ADMIN API 접근 시도:
                value: "{\n  \"name\" : \"상품1\",\n  \"stock\" : 10,\n  \"price\" :\
                  \ 10000\n}"
              상품 등록 성공:
                value: "{\n  \"name\" : \"상품1\",\n  \"stock\" : 10,\n  \"price\" :\
                  \ 10000\n}"
              상품 등록 실패 - 이름이 비어있음:
                value: "{\n  \"name\" : \"\",\n  \"stock\" : 10,\n  \"price\" : 10000\n\
                  }"
      responses:
        "403":
          description: "403"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                상품 등록 실패 - USER 권한으로 ADMIN API 접근 시도:
                  value: "{\n  \"code\" : \"ACCESS_DENIED\",\n  \"message\" : \"접근\
                    \ 권한이 없습니다.\"\n}"
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                상품 등록 성공:
                  value: "{\n  \"id\" : 1,\n  \"name\" : \"상품1\",\n  \"stock\" : 10,\n\
                    \  \"price\" : 10000\n}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                상품 등록 실패 - 이름이 비어있음:
                  value: "{\n  \"code\" : \"INVALID_INPUT\",\n  \"message\" : \"입력\
                    값이 유효하지 않습니다.\",\n  \"errors\" : {\n    \"name\" : \"상품 이름은 필수\
                    입니다.\"\n  }\n}"
  /products/{id}:
    get:
      tags:
      - 상품 API
      summary: 상품 단일 조회
      description: 상품 ID를 통해 특정 상품의 상세 정보를 조회합니다.
      operationId: '상품 단일 조회 '
      parameters:
      - name: id
        in: path
        description: ""
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                상품 단일 조회 성공:
                  value: "{\n  \"id\" : 1,\n  \"name\" : \"상품1\",\n  \"stock\" : 10,\n\
                    \  \"price\" : 10000\n}"
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                상품 단일 조회 실패 - 존재하지 않는 상품:
                  value: "{\n  \"code\" : \"PRODUCT_NOT_FOUND\",\n  \"message\" :\
                    \ \"상품을 찾을 수 없습니다. (ID: 999)\",\n  \"errors\" : { }\n}"
    patch:
      tags:
      - 상품 API
      summary: 상품 수정
      description: 기존 상품의 정보를 수정합니다. ADMIN 권한이 필요합니다.
      operationId: '상품 수정 '
      parameters:
      - name: id
        in: path
        description: ""
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/users-addresses486549215'
            examples:
              상품 수정 실패 - USER 권한으로 ADMIN API 접근 시도:
                value: "{\n  \"name\" : \"상품2\",\n  \"stock\" : 20,\n  \"price\" :\
                  \ 20000\n}"
              상품 수정 실패 - 이름이 비어있음:
                value: "{\n  \"name\" : \"\",\n  \"stock\" : 20,\n  \"price\" : 20000\n\
                  }"
              상품 수정 성공:
                value: "{\n  \"name\" : \"상품2\",\n  \"stock\" : 20,\n  \"price\" :\
                  \ 20000\n}"
      responses:
        "403":
          description: "403"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                상품 수정 실패 - USER 권한으로 ADMIN API 접근 시도:
                  value: "{\n  \"code\" : \"ACCESS_DENIED\",\n  \"message\" : \"접근\
                    \ 권한이 없습니다.\"\n}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                상품 수정 실패 - 이름이 비어있음:
                  value: "{\n  \"code\" : \"INVALID_INPUT\",\n  \"message\" : \"입력\
                    값이 유효하지 않습니다.\",\n  \"errors\" : {\n    \"name\" : \"상품 이름은 필수\
                    입니다.\"\n  }\n}"
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                상품 수정 성공:
                  value: "{\n  \"id\" : 1,\n  \"name\" : \"상품2\",\n  \"stock\" : 20,\n\
                    \  \"price\" : 20000\n}"
  /users/addresses:
    post:
      tags:
      - 사용자 API
      summary: 배송지 주소 등록
      description: 인증된 사용자의 배송지 주소를 등록합니다. 수령인 정보와 주소 정보를 입력받아 새로운 배송지를 생성합니다.
      operationId: 주소 등록 - 성공
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/users-addresses486549215'
            examples:
              주소 등록 - 성공:
                value: "{\n  \"receiverName\" : \"홍길동\",\n  \"receiverPhoneNumber\"\
                  \ : \"01012345678\",\n  \"zipCode\" : \"12345\",\n  \"baseAddress\"\
                  \ : \"서울특별시 중구 세종대로\",\n  \"detailAddress\" : \"101동 1001호\"\n}"
      responses:
        "201":
          description: "201"
  /users/login:
    post:
      security: []
      tags:
      - 인증 API
      summary: 로그인
      description: 사용자 인증 후 Access Token과 Refresh Token 발급
      operationId: '로그인 '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/users-addresses486549215'
            examples:
              로그인 실패 - 잘못된 자격증명:
                value: "{\n  \"loginId\" : \"unknownUser\",\n  \"password\" : \"wrongPassword\"\
                  \n}"
              로그인 성공:
                value: "{\n  \"loginId\" : \"testUser\",\n  \"password\" : \"password123\"\
                  \n}"
      responses:
        "401":
          description: "401"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                로그인 실패 - 잘못된 자격증명:
                  value: "{\n  \"code\" : \"BAD_CREDENTIALS\",\n  \"message\" : \"\
                    아이디 또는 비밀번호가 일치하지 않습니다.\",\n  \"errors\" : { }\n}"
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/users-addresses486549215'
              examples:
                로그인 성공:
                  value: "{\n  \"accessToken\" : \"mock-access-token\",\n  \"refreshToken\"\
