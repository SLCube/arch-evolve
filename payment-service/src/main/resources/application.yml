server:
  port: 8081

spring:
  application:
    name: payment-service
  docker:
    compose:
      file: payment-service/docker-compose.yml
  datasource:
    url: jdbc:postgresql://localhost:5433/payment
    username: payment
    password: payment
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

logging:
  level:
    root: info
    com.playground: info
